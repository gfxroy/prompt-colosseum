# .github/workflows/prompt-ci.yml - fail PRs that regress your prompts.
name: Prompt CI
on:
  pull_request:
    paths: ["prompts/**", "evals/**"]
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gfxroy/prompt-colosseum@v0.2.0
        with:
          suite: evals/support.yaml
          baseline: evals/baseline.json # commit the results JSON from your main branch
          args: --provider gemini --repeats 3 --rpm 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # or OPENAI_API_KEY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colosseum-results
          path: |
            colosseum-results.json
            colosseum-junit.xml
